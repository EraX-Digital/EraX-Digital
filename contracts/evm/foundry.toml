[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.30"
optimizer = true
optimizer_runs = 200
evm_version = "cancun"
fs_permissions = [{ access = "read", path = "./" }]

[profile.default.fuzz]
runs = 256

[profile.default.invariant]
runs = 64
depth = 20
fail_on_revert = false

[rpc_endpoints]
sepolia = "${EVM_RPC_URL_11155111}"
base_sepolia = "${EVM_RPC_URL_84532}"
mainnet = "${EVM_RPC_URL_1}"
base = "${EVM_RPC_URL_8453}"

[etherscan]
sepolia = { key = "${ETHERSCAN_API_KEY}", chain = 11155111 }
base_sepolia = { key = "${BASESCAN_API_KEY}", chain = 84532 }
mainnet = { key = "${ETHERSCAN_API_KEY}", chain = 1 }
base = { key = "${BASESCAN_API_KEY}", chain = 8453 }

# Dependencies are installed, not vendored:
#   forge-std v1.11.0
#   openzeppelin-contracts v5.4.0
# Foundry used for the local run is recorded in docs/PHASE_5_COMPLETION_REPORT.md.
