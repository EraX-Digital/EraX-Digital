services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: erax
      POSTGRES_PASSWORD: erax_local_dev_only
      POSTGRES_DB: erax
    ports:
      - "5432:5432"
    volumes:
      - erax-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U erax -d erax"]
      interval: 5s
      timeout: 5s
      retries: 20

  valkey:
    image: valkey/valkey:8-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "valkey-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  mailpit:
    image: axllent/mailpit:v1.27
    ports:
      - "1025:1025"
      - "8025:8025"

volumes:
  erax-postgres:
